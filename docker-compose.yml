# Local development stack: the app + a Postgres database.
# Run everything with:  docker compose up --build
# Run only the DB (for `npm test` on the host):  docker compose up db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://notes:notes@db:5432/notes
      PGSSL: "false"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
